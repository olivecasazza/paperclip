name: commitperclip PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Always runs from base branch context — never executes PR code.
# pull_request_target gives access to secrets for untrusted fork PRs.

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Declared at job level (not step level) so the step-level `if` guards below
    # can read it via the env context. Step-level env is not visible to `if`.
    env:
      COMMITPERCLIP_KEY: ${{ secrets.COMMITPERCLIP_KEY }}
    steps:
      - name: Checkout base branch (never PR code)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # A missing COMMITPERCLIP_KEY is a configuration gap, not a verdict on the
      # PR. Dependency Review above is the security gate and still fails hard.
      # Skip the bot-commented gates instead of failing every open PR.
      - name: Generate commitperclip token
        id: token
        if: env.COMMITPERCLIP_KEY != ''
        run: |
          TOKEN=$(node .github/scripts/get-bot-token.mjs)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> $GITHUB_OUTPUT

      - name: Warn when commitperclip token is unavailable
        if: env.COMMITPERCLIP_KEY == ''
        run: |
          echo "::warning title=commitperclip not configured::COMMITPERCLIP_KEY is not set on this repository, so the commitperclip PR quality gates (linked issue, test coverage, template, lockfile, dedup search) were skipped. Configure the repository secret to enable them. Dependency Review still ran and its result is authoritative."

      - name: Run quality gates
        id: quality
        if: env.COMMITPERCLIP_KEY != '' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: node .github/scripts/run-quality-gates.mjs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.value }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}

      - name: Fail if quality gates failed
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.quality.outcome == 'failure'
        run: |
          echo "One or more quality gates failed. See commitperclip comment on the PR for details."
          exit 1
